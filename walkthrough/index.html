<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urable Data Import Tool · Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Urable One-Page Style Sheet V1-2026 */
    --mint:#2FD2A8;        /* Velocity Mint */
    --blue:#2A7FFF;        /* Command Blue */
    --engine:#222428;      /* Engine Black */
    --slate:#AEB1B7;       /* Soft Slate */
    --mist:#F4F5F8;        /* Mist Gray */
    --white:#FFFFFF;       /* Base White */
    --mint-deep:#1FA986;
    --engine-2:#2B2E33;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'PT Sans',sans-serif;
    color:var(--engine);
    display:flex;flex-direction:column;
    min-height:100vh;
    background:var(--engine);
    position:relative;
    overflow-x:hidden;
  }
  /* ---- brand background: matches the style-sheet hero —
         Engine Black, two diagonal mint bars, then the solid mint field ---- */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(105deg,
        transparent 0 59%,
        #B2E5D2 59% 64.5%,
        #74D2B6 64.5% 70%,
        #4DC0A2 70% 100%);
  }
  header,main,.progress{position:relative;z-index:1}

  /* ---------- top bar ---------- */
  header{
    color:var(--white);
    display:flex;align-items:center;gap:18px;
    padding:16px 24px 10px;flex-shrink:0;
  }
  .wordmark-img{height:30px;width:auto;display:block;padding:2px 0}
  .bar-title{
    font-family:'Fredoka',sans-serif;font-weight:500;font-size:13px;
    text-transform:uppercase;letter-spacing:1.8px;color:var(--slate);
    border-left:1px solid #3A3E44;padding-left:18px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* plus-cluster brand motif */
  .plus-cluster{
    margin-left:auto;display:grid;grid-template-columns:repeat(2,14px);
    gap:5px;margin-right:14px;flex-shrink:0;
  }
  .plus-cluster i{
    position:relative;width:14px;height:14px;display:block;
  }
  .plus-cluster i::before,.plus-cluster i::after{
    content:"";position:absolute;background:var(--mint);border-radius:1px;
  }
  .plus-cluster i::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
  .plus-cluster i::after{top:50%;left:0;right:0;height:3px;transform:translateY(-50%)}
  .parts{display:flex;gap:6px}
  .part-tab{
    font-family:'Fredoka',sans-serif;font-weight:500;font-size:12px;letter-spacing:1px;
    text-transform:uppercase;color:var(--white);background:var(--engine-2);
    border:1px solid #4A4E55;border-radius:999px;padding:7px 15px;
    cursor:pointer;transition:all .15s;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .part-tab.active{color:var(--engine);background:var(--mint);border-color:var(--mint)}
  .part-tab:hover:not(.active){border-color:var(--mint);color:var(--mint)}

  /* ---------- progress ---------- */
  .progress{
    display:flex;gap:3px;padding:6px 24px 0;flex-shrink:0;
  }
  .progress .group{display:flex;gap:3px;flex:1}
  .progress .group + .group{margin-left:14px}
  .tick{
    flex:1;height:5px;border-radius:3px;background:#41454B;
    cursor:pointer;transition:background .2s;border:none;
  }
  .tick.done{background:var(--mint-deep)}
  .tick.current{background:var(--mint)}
  .tick:hover{background:var(--mint)}

  /* ---------- stage ---------- */
  main{
    flex:1;display:flex;flex-direction:column;
    padding:14px 24px 22px;gap:14px;min-height:0;
  }
  .stage{
    position:relative;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
  }
  .shot-wrap{position:relative;max-width:100%;max-height:100%;line-height:0}
  .shot-wrap img{
    max-width:100%;max-height:calc(100vh - 310px);
    display:block;border-radius:14px;
    box-shadow:0 10px 32px rgba(0,0,0,.45);
    user-select:none;-webkit-user-drag:none;
  }

  /* hotspot ring — small center dot so the target stays visible */
  .hotspot{
    position:absolute;width:58px;height:58px;
    transform:translate(-50%,-50%);
    border-radius:50%;cursor:pointer;border:none;background:transparent;
    z-index:5;
  }
  .hotspot::before,.hotspot::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    border:3px solid var(--mint);
    box-shadow:0 0 0 1px rgba(34,36,40,.25), inset 0 0 0 1px rgba(34,36,40,.25);
  }
  .hotspot::after{animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{
    0%{transform:scale(1);opacity:.9}
    100%{transform:scale(2.1);opacity:0}
  }
  .hotspot .dot{
    position:absolute;left:50%;top:50%;width:4px;height:4px;
    transform:translate(-50%,-50%);border-radius:50%;background:var(--mint);
    opacity:.85;
  }
  @media (prefers-reduced-motion:reduce){.hotspot::after{animation:none;opacity:.4}}

  /* ---------- caption card ---------- */
  .caption{
    flex-shrink:0;background:var(--white);
    border-radius:14px;
    padding:16px 22px;display:flex;align-items:center;gap:20px;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
  }
  .step-no{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:30px;
    color:var(--mint-deep);min-width:60px;line-height:1;
  }
  .step-no small{
    display:block;font-family:'PT Sans',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;color:var(--slate);margin-bottom:2px;
  }
  .step-text{flex:1;min-width:0}
  .step-text h2{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;
    text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;
    color:var(--engine);
  }
  .step-text p{font-size:14.5px;color:#5C636B;line-height:1.45}
  .step-text p b{color:var(--engine)}
  .note{
    margin-top:6px;font-size:13px;line-height:1.4;
    color:#1C6FE8;background:rgba(42,127,255,.08);
    border-left:3px solid var(--blue);
    padding:6px 10px;border-radius:0 6px 6px 0;
  }
  .nav{display:flex;gap:8px;flex-shrink:0}
  .btn{
    font-family:'PT Sans',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;border-radius:8px;padding:12px 22px;
    cursor:pointer;border:1px solid #D9DCE0;background:var(--white);color:var(--engine);
    transition:all .15s;
  }
  .btn:hover{border-color:var(--engine)}
  .btn.primary{background:var(--mint);border-color:var(--mint);color:var(--engine)}
  .btn.primary:hover{background:var(--mint-deep);border-color:var(--mint-deep);color:var(--white)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn:disabled:hover{border-color:#D9DCE0;background:var(--white);color:var(--engine)}
  .btn.primary:disabled:hover{background:var(--mint);color:var(--engine)}
  .btn:focus-visible,.hotspot:focus-visible,.part-tab:focus-visible,.tick:focus-visible{
    outline:3px solid var(--mint);outline-offset:2px;
  }

  @media (max-width:760px){
    header{padding:12px 14px 8px;gap:10px;flex-wrap:wrap}
    .bar-title{display:none}
    .plus-cluster{display:none}
    .parts{margin-left:auto}
    main{padding:10px 14px 16px}
    .progress{padding:6px 14px 0}
    .shot-wrap img{max-height:calc(100vh - 340px)}
    .caption{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}
    .nav{width:100%;justify-content:space-between}
    .nav .btn{flex:1}
    .step-no{display:flex;align-items:baseline;gap:8px;min-width:0}
  }
</style>
</head>

<script>
const steps=[
 {img:"step-01.webp",part:"A",title:"Open the tool",
  body:"Go to <b>urable-import-tool.vercel.app</b> and bookmark it. Nothing to download or install \u2014 it always loads the current version, so just refresh if something looks off. Three boxes: <b>Customers</b>, <b>Products &amp; Services</b>, <b>Jobs History</b>. Drop the shop's export into whichever one matches.",
  hs:[50,46.4],
  note:"Everything is processed inside your own browser. Customer files are never uploaded to a server. The one exception is the direct API import, which writes into the shop's Urable account \u2014 which is what you asked it to do."},
 {img:"step-02.webp",part:"A",title:"Check what it detected",
  body:"Drop the file and the tool names the format it recognised \u2014 here <b>Mobile Tech RX</b>. The right-hand count is what matters: how many customers came through, and how many duplicates it merged. If that number looks wildly wrong, stop and look at the file before going further.",
  hs:[71.4,33.1]},
 {img:"step-03.webp",part:"A",title:"Read the preview",
  body:"The first five rows, mapped into the Urable template. Spot-check them: names in the right fields, phone numbers intact, addresses where you expect. Two people on one phone number stay two customers \u2014 households share a home phone, so the tool only merges when the names match too.",
  hs:[50,51]},
 {img:"step-04.webp",part:"A",title:"Download the CSV",
  body:"Click <b>Download Urable-ready CSV</b> and send it to the onboarding specialist, or upload it yourself if CSV import is enabled on the account. This is the normal path and the safest one, because a human sees the file before anything is written.",
  hs:[33,88.4],
  note:"The file comes out at exactly 13 columns with no blank rows \u2014 nothing past the Item column. That's deliberate: the Urable importer rejects files with stray columns hanging off the end."},
 {img:"step-05.webp",part:"B",title:"When the format isn't recognised",
  body:"If the columns are tidy but the system is one the tool hasn't seen, you get <b>Map your columns</b> instead of a preview. This is normal and it's still a two-minute job \u2014 you're just telling the tool which column is which.",
  hs:[50,19.2]},
 {img:"step-06.webp",part:"B",title:"Match the columns",
  body:"Each Urable field gets a dropdown. The tool pre-fills its best guesses and highlights them <b>green</b> \u2014 check those first, they're usually right. Set anything irrelevant to <b>\u2014 skip \u2014</b>. If the file has one full-name column, pick it for First Name and the tool splits it.",
  hs:[55.7,45.0]},
 {img:"step-07.webp",part:"B",title:"Keep everything, then apply",
  body:"Leave <b>Add all unmapped columns to Notes</b> ticked. Anything you didn't map lands in the customer's Notes instead of being thrown away \u2014 lead source, tags, account numbers. Then click <b>Apply mapping</b>.",
  hs:[25.7,82.1],
  note:"Not confident about a mapping? Send the file to Claire instead of guessing. She has a Claude skill that cleans messy lists into the Urable template, and the cleaned file drops straight back into this tool."},
 {img:"step-08.webp",part:"B",title:"Same preview, same download",
  body:"After Apply you're back on the standard preview and the flow is identical to Part A \u2014 check the rows, then download the CSV or switch to the direct import.",
  hs:[50,51]},
 {img:"step-09a.webp",part:"C",title:"Find the API keys",
  body:"The direct import needs an API key from the <b>customer's</b> Urable account, not yours. In their account go to <b>Settings</b>, scroll to the <b>Developer</b> section, and click <b>+ CREATE API KEY</b>. This needs an admin login.",
  hs:[75.1,64.9],
  note:"Existing keys are listed here with their scopes. If a shop already has a key you can't read it \u2014 keys are only ever shown once \u2014 so just create a new one."},
 {img:"step-09b.webp",part:"C",title:"Name it",
  body:"Call it <b>Urable Import</b>. The name is only a label, but a clear one means the shop knows what it's for later and can revoke it safely once the migration is done.",
  hs:[49.6,34.8]},
 {img:"step-09c.webp",part:"C",title:"Tick every scope",
  body:"Select <b>all</b> of the scopes listed. The importer touches customers, items, products, jobs, payments and more, and a key missing even one scope fails partway through the import rather than up front. There's no downside to granting them all on a key you revoke afterwards.",
  hs:[36.2,55.4],
  note:"Scroll the whole list \u2014 the scopes continue past the bottom of the panel. All sixteen should be checked before you save."},
 {img:"step-09d.webp",part:"C",title:"Copy it now",
  body:"The key is shown <b>once</b>. Copy it with the icon on the right and paste it straight into the import tool before you click Done. Once this dialog closes there is no way to see it again.",
  hs:[62.6,53.2],
  note:"Lost it? No problem \u2014 you can't recover a key, but you can create another one in seconds. Revoke the old one so it doesn't linger."},
  {img:"step-09.webp",part:"C",title:"Paste it into the tool",
  body:"Back in the import tool, switch to the <b>Import directly to Urable</b> tab and paste the key. Set the server to match the account the key came from \u2014 <b>Production</b> for a live shop. Then set the industry to match.",
  hs:[37.3,66.9],
  note:"The key is used for that import only and is never stored. It stays in the browser tab. The screenshots in this part were captured against a dev account, so they show Dev server."},
  {img:"step-10.webp",part:"C",title:"Test the connection first",
  body:"Click <b>Test connection</b> before anything else. <b>\u2713 Connected</b> means the key and the server match and the import can write. Anything else and you stop here \u2014 a bad key wastes a long run.",
  hs:[66.3,72.6],
  note:"The result only shows on the button for a few seconds. If you miss it, just click again. \"Error 400\" means the key is wrong \u2014 the API reports a bad token as 400, not 401."},
 {img:"step-10b.webp",part:"C",title:"Start it and watch",
  body:"Tick your options, then <b>Start import</b>. The browser asks you to confirm the job count first \u2014 click OK. The bar then runs through the phases in order: matching existing records, then customers, services, vehicles, jobs and finally historical payments.",
  hs:[49.6,90.5],
  note:"Leave the tab open and don't navigate away. The import runs from this page \u2014 closing it stops the run partway."},
 {img:"step-10c.webp",part:"C",title:"Read the summary",
  body:"When it finishes you get counts for everything created, matched and skipped \u2014 and, in red, anything that failed with the reason. This real run did <b>95 jobs created, 3 already imported (skipped), 20 customers, 35 vehicles, 9 historical payments</b> \u2014 and <b>14 jobs failed</b> because those field jobs had no customer address in the source file.",
  hs:[49.6,85.0],
  note:"Failures are normal and safe: the rest still imported. Fix the underlying data (here, add addresses) and re-run the same file \u2014 already-imported jobs are skipped, so only the failures get retried."},
 {img:"step-11.webp",part:"D",title:"Products & services",
  body:"Same flow in the second box. Tiered menus come through grouped \u2014 a service priced for Coupe / Sedan / SUV becomes one service with three price points, not three services.",
  hs:[71.9,33.1]},
 {img:"step-12.webp",part:"D",title:"Check prices before importing",
  body:"Services vary wildly between systems, so this preview is worth more of your attention than the customer one. Check the prices and the variant labels against the shop's actual menu.",
  hs:[50,52.6]},
 {img:"step-13.webp",part:"D",title:"Jobs history",
  body:"The third box is the full migration: past jobs with dates, vehicles, services, invoice amounts and historical payments. Note the second figure \u2014 total historical payments. Jobs are <b>API import only</b>; there's no CSV path.",
  hs:[67.3,33.1]},
 {img:"step-14.webp",part:"D",title:"Review the jobs preview",
  body:"Job numbers, status, customer, vehicle, line items and amounts. Job totals are exact; the split across individual line items is approximate, because most source exports don't carry per-line prices.",
  hs:[50,37.7]},
 {img:"step-15.webp",part:"D",title:"The one decision that matters",
  body:"<b>Add each historical service to the catalog</b> \u2014 leave this <b>unchecked</b> on an account that already has a real service menu. Historical jobs then bill against a single generic \"Imported historical service\" entry, with the real names preserved in each job's notes, so the shop's live catalog stays clean. Tick it only on a fresh account with no menu yet.",
  hs:[25.7,73.9],
  note:"Run the customers import first, confirm it looks right, then run jobs. The jobs pass matches existing customers rather than recreating them.",
  finish:true}
];

let i=0;
const shot=document.getElementById('shot'),
      hotspot=document.getElementById('hotspot'),
      stepNum=document.getElementById('stepNum'),
      stepTitle=document.getElementById('stepTitle'),
      stepBody=document.getElementById('stepBody'),
      stepNote=document.getElementById('stepNote'),
      prevBtn=document.getElementById('prevBtn'),
      nextBtn=document.getElementById('nextBtn'),
      progress=document.getElementById('progress');

const PART_IDS=["A", "B", "C", "D"];
const groups={};
PART_IDS.forEach(pid=>{
  const g=document.createElement('div');g.className='group';
  g.style.flex=String(steps.filter(s=>s.part===pid).length);
  groups[pid]=g;
});
steps.forEach((s,idx)=>{
  const t=document.createElement('button');
  t.className='tick';t.setAttribute('aria-label','Go to step '+(idx+1));
  t.onclick=()=>goTo(idx);
  groups[s.part].appendChild(t);
});
PART_IDS.forEach(pid=>progress.appendChild(groups[pid]));
const ticks=progress.querySelectorAll('.tick');

steps.forEach(s=>{const im=new Image();im.src='images/'+s.img;});

function render(){
  const s=steps[i];
  shot.src='images/'+s.img;
  shot.alt='Step '+(i+1)+': '+s.title;
  stepNum.textContent=i+1;
  stepTitle.textContent=s.title;
  stepBody.innerHTML=s.body;
  if(s.note){stepNote.style.display='block';stepNote.textContent=s.note;}
  else{stepNote.style.display='none';}
  if(s.hs){hotspot.style.display='block';hotspot.style.left=s.hs[0]+'%';hotspot.style.top=s.hs[1]+'%';}
  else{hotspot.style.display='none';}
  prevBtn.disabled=(i===0);
  nextBtn.textContent=s.finish?'Start over':'Next';
  ticks.forEach((t,idx)=>{
    t.classList.toggle('done',idx<i);
    t.classList.toggle('current',idx===i);
  });
  PART_IDS.forEach(pid=>document.getElementById('tab'+pid).classList.toggle('active',s.part===pid));
}
function next(){ i=(steps[i].finish)?0:Math.min(i+1,steps.length-1); render(); }
function prev(){ i=Math.max(i-1,0); render(); }
function goTo(n){ i=n; render(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  if(e.key==='ArrowLeft'){e.preventDefault();prev();}
});
render();
</script>
</body>
</html>
